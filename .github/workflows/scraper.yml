name: Extractor Automatico Polla La Fortuna

on:
  schedule:
    - cron: '5 13,14,15,16,17,19,20,21,22,23 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Librerías
        run: |
          pip install requests beautifulsoup4 firebase-admin

      - name: Ejecutar Extractor
        run: python scraper.py

